<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2340"></stop>
      <stop offset="1" stop-color="#0a0e1c"></stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity="0.9"></stop>
      <stop offset="0.5" stop-color="#3fa0ff" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#1a5fd0" stop-opacity="0.75"></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fc8ff" stop-opacity="0.8"></stop>
      <stop offset="1" stop-color="#5fc8ff" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="btnclip">
      <rect x="262" y="392" width="500" height="240" rx="120"></rect>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"></rect>

  
  <ellipse cx="512" cy="512" rx="420" ry="260" fill="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"></animate>
  </ellipse>

  
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1.04 1.04;1 1" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"></animateTransform>
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;-10 -12;0 0" dur="3s" repeatCount="indefinite"></animateTransform>

    
    <rect x="262" y="410" width="500" height="240" rx="120" fill="#000" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3s" repeatCount="indefinite"></animate>
    </rect>

    
    <rect x="262" y="392" width="500" height="240" rx="120" fill="url(#glass)" stroke="#bfeaff" stroke-width="2" stroke-opacity="0.6"></rect>

    
    <g clip-path="url(#btnclip)">
      <ellipse cx="380" cy="560" rx="160" ry="90" fill="#6fe0ff" opacity="0.35">
        <animate attributeName="cx" values="340;700;340" dur="6s" repeatCount="indefinite"></animate>
        <animate attributeName="cy" values="560;440;560" dur="5s" repeatCount="indefinite"></animate>
      </ellipse>
      <ellipse cx="640" cy="470" rx="140" ry="80" fill="#a0c8ff" opacity="0.3">
        <animate attributeName="cx" values="680;320;680" dur="7s" repeatCount="indefinite"></animate>
        <animate attributeName="cy" values="470;580;470" dur="6.5s" repeatCount="indefinite"></animate>
      </ellipse>

      
      <rect x="-200" y="392" width="160" height="240" fill="#ffffff" opacity="0.4" transform="skewX(-20)">
        <animate attributeName="x" values="-200;900" dur="3.5s" repeatCount="indefinite"></animate>
      </rect>
    </g>

    
    <rect x="300" y="410" width="424" height="90" rx="45" fill="url(#shine)" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="3s" repeatCount="indefinite"></animate>
    </rect>

    
    <text x="512" y="530" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95">
      LIQUID
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" repeatCount="indefinite"></animate>
    </text>
  </g>
</svg>